[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-generation"
dynamic = ["version"]
description = "Declarative generation.json parsing, validation, and processing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "dataclasses-json>=0.5",
    "pyyaml",
    "mashumaro",
    "datamodel-code-generator>=0.72.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4",
    "setuptools-scm[toml]>=8.0",
]
excel = ["openpyxl>=3.1"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"