schema_version: '1.0'

# Sources
sources:
  realis_project:
    type: json
    path: '{input_file}'
    select: $
    mapping:
      name: ProjectName
      metadata.stress_operation_name: StressOperationName
      metadata.test_id: TestId
      metadata.project_id: ProjectId
      metadata.lab_tracking_number: LabTrackingNo
      metadata.project_owner: ProjectOwner
      metadata.department: Department
      metadata.reason_type: ReasonType
      metadata.priority: Priority
      metadata.development_code: DevelopmentCode
      metadata.product_basic_type: ProdBasicType
      metadata.sales_code: SalesCode
      metadata.package: Package
      metadata.pin_count: PinCount
      metadata.test_type: TestType
      metadata.test_sub_type: TestSubType
      metadata.standard: ActualStandard
      metadata.machine: Machine
      metadata.verifier_board: VerifierBoard
      metadata.operator: Operator
      metadata.temperature: Temperature
      metadata.stress_current: StressCurrent
      metadata.program_name: ProgramName
  realis_pins:
    type: json
    path: '{input_file}'
    select: $.EsdPins[*]
    mapping:
      designator: Number
      name: Name
      parameters.pin_type:
        from: PinType
        mapping: realis_pin_type
      parameters.v_max: VoltageLevelMax
      parameters.v_min: VoltageLevelMin

hardware:
  source: ../../sources/hardware_config/hardware.yaml

project:
  source: realis_project
mappings:
  realis_pin_type:
    I: INPUT
    Input: INPUT
    O: OUTPUT
    Output: OUTPUT
    IO: IO
    Supply: POWER
    Ground: GROUND
    not connected: NC
    not tested: NC
  group_type_prefix:
    INPUT: In
    OUTPUT: O
    IO: IO
    POWER: Su
    GROUND: GND
    NC: NC
  logic_level_token:
    HIGH: H
    LOW: L
  polarity_token:
    POSITIVE: '+'
    NEGATIVE: '-'
formatters:
  voltage_token:
    type: decimal_token
    separator: V
    decimal_places: 1
dut:
  name: REALIS DUT
  pins:
    source: realis_pins
groups:
  generation:
  - id: groups_by_type_and_vmax
    group_by:
    - parameters.pin_type
    - parameters.v_max
    set:
      group_type:
        from: partition.parameters.pin_type
      parameters.v_max:
          from: partition.parameters.v_max
          cast: float
      parameters.v_min: 0.0
      parameters.compliance_limit:
        - when:
            partition.parameters.pin_type: POWER
          value: 0.2
        - when:
            partition.parameters.pin_type:
              in:
              - INPUT
              - IO
              - OUTPUT
          value: 0.12
    name:
      template: '{prefix}{voltage}'
      fields:
        prefix:
          source: partition.parameters.pin_type
          mapping: group_type_prefix
        voltage:
          source: partition.parameters.v_max
          formatter: voltage_token
#          when:
#            partition.parameters.pin_type:
#                in:
#                - INPUT
#                - IO
#                - OUTPUT
#                - POWER
device_states:
  logic_low:
    allocation:
      mode: hybrid
      strategy: voltage_first
      reserve:
      - DC1
      ganging_policy: same_voltage
    rules:
    - when:
        group.group_type: GROUND
      set:
        assignment: GROUND
        bias:
          mode: GROUND
    - when:
        group.group_type:
        in:
          - OUTPUT
          - NC
      set:
        assignment: FLOATING
        bias:
          mode: FLOATING
    - when:
        group.group_type: POWER
      set:
        bias:
          mode: VOLTAGE
          level:
            from: group.v_max
    - when:
        group.group_type:
          in:
          - INPUT
          - IO
      set:
        assignment: GROUND
        bias:
          mode: GROUND
  logic_high:
    allocation:
      mode: hybrid
      strategy: voltage_first
      reserve:
      - DC1
      ganging_policy: same_voltage
    rules:
    - when:
        group.group_type: GROUND
      set:
        assignment: GROUND
        bias:
          mode: GROUND
    - when:
        group.group_type:
        in:
          - OUTPUT
          - NC
      set:
        assignment: FLOATING
        bias:
          mode: FLOATING
    - when:
        group.group_type:
          in:
          - INPUT
          - IO
          - POWER
      set:
        bias:
          mode: VOLTAGE
          level:
            from: group.v_max
test_plan_generation:
  rules:
  - id: signal_tests
    groups:
      select:
        where:
          group_type:
            in:
            - INPUT
            - OUTPUT
            - IO
          parameters.v_max:
            exists: true
          parameters.v_min:
            exists: true
      partition:
        mode: each
    dimensions:
    - name: polarity
      values:
      - value: POSITIVE
        set:
          stress_parameters.peak:
            from: group.v_max
            multiply_by:
            - 1.0
            - 1.5
      - value: NEGATIVE
        set:
          stress_parameters.peak:
            from: group.v_min
            multiply_by:
            - 1.0
            - 1.5
    - name: logic_level
      values:
      - value: HIGH
        set:
          device_state: logic_high
      - value: LOW
        set:
          device_state: logic_low
    template:
      test_type: SIGNAL
      name:
        template: LU_{group}_{logic}{polarity}
        fields:
          group:
            source: group.name
          logic:
            source: logic_level
            mapping: logic_level_token
          polarity:
            source: polarity
            mapping: polarity_token
      stress_parameters:
        source_mode: voltage
        base: 0.0
        compliance: 0.12
        pulse_width: 0.1
  - id: supply_tests
    groups:
      select:
        where:
          group_type: POWER
          parameters.v_max:
            exists: true
      partition:
        mode: each
    dimensions:
    - name: logic_level
      values:
      - value: HIGH
        set:
          device_state: logic_high
      - value: LOW
        set:
          device_state: logic_low
    template:
      test_type: SUPPLY
      name:
        template: LU_{group}_{logic}
        fields:
          group:
            source: group.name
          logic:
            source: logic_level
            mapping: logic_level_token
      stress_parameters:
        source_mode: voltage
        base: 0.0
        peak:
          from: group.v_max
          multiply_by:
          - 1.0
          - 1.5
        compliance: 0.2
        pulse_width: 0.01
